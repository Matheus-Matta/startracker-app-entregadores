name: Bloquear credenciais no Git

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Verificar arquivos e historico
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar historico completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Baixar todas as branches remotas
        shell: bash
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Impedir credenciais versionadas
        run: python tool/check_repository_secrets.py --history
